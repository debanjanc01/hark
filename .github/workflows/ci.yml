name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15  # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/fetch-deps.sh') }}
      - name: Test
        run: make test
      - name: Build app
        run: make app
