name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Apple Silicon. The oldest macOS runner has the oldest Swift (6.0) Hark supports;
    # what builds there also runs on newer macOS.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          swift --version
      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/fetch-deps.sh') }}
      - name: Test
        run: make test
      - name: Build app
        run: make app

  # Installs the release zip this commit builds with the cask in packaging/homebrew, the
  # way `brew install --cask` does, so a packaging problem shows up before a release.
  homebrew:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/fetch-deps.sh') }}
      - name: Install with the cask
        run: |
          make deps dist
          zip=$PWD/build/Hark-$(cat VERSION).zip
          brew tap debanjanc01/tap
          brew trust --cask debanjanc01/tap/hark || true
          sed -e "s|^  version \".*\"|  version \"$(cat VERSION)\"|" \
              -e "s|^  sha256 \".*\"|  sha256 \"$(shasum -a 256 "$zip" | cut -d' ' -f1)\"|" \
              -e "s|^  url \".*\"|  url \"file://$zip\"|" \
            packaging/homebrew/hark.rb > "$(brew --repo debanjanc01/tap)/Casks/hark.rb"
          brew install --cask debanjanc01/tap/hark
      - name: Transcribe with the installed app
        run: |
          say -o "$RUNNER_TEMP/hark.aiff" "Hark is listening."
          /Applications/Hark.app/Contents/MacOS/Hark --transcribe "$RUNNER_TEMP/hark.aiff" --language en | tee "$RUNNER_TEMP/out.json"
          grep -qi listening "$RUNNER_TEMP/out.json"
      - name: Uninstall with the cask
        run: |
          brew uninstall --cask debanjanc01/tap/hark
          test ! -e /Applications/Hark.app
