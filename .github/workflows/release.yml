name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14  # the oldest runner: what builds there runs on newer macOS too
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          swift --version

      - name: Check VERSION matches tag
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

      - name: Test
        run: make test

      # Optional: sign with a Developer ID and notarize, if the secrets are configured.
      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
      - name: Store notarization credentials
        if: env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: xcrun notarytool store-credentials hark --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"

      - name: Build and package
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ env.HAS_NOTARY == 'true' && 'hark' || '' }}
        run: make dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Hark-*.zip build/Hark-*.zip.sha256 \
            --title "Hark $GITHUB_REF_NAME" --generate-notes

  # A Homebrew bottle (a prebuilt Hark), so `brew install` doesn't compile anything or need
  # Xcode. Built on the oldest macOS runner, since Homebrew also uses a bottle on newer
  # macOS versions. The tap's formula then points at it (see RELEASING.md).
  bottle:
    needs: release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          swift --version

      - name: Put this release's formula in the tap
        run: |
          url="https://github.com/debanjanc01/hark/archive/refs/tags/$GITHUB_REF_NAME.tar.gz"
          sha=$(curl -fsSL "$url" | shasum -a 256 | cut -d' ' -f1)
          brew tap debanjanc01/tap
          brew trust --formula debanjanc01/tap/hark || true
          sed -e "s|^  url \".*\"|  url \"$url\"|" -e "s|^  sha256 \".*\"|  sha256 \"$sha\"|" \
            packaging/homebrew/hark.rb > "$(brew --repo debanjanc01/tap)/Formula/hark.rb"

      - name: Build and test the bottle
        env:
          HOMEBREW_NO_INSTALL_FROM_API: 1
        run: |
          brew install --build-bottle debanjanc01/tap/hark
          brew test debanjanc01/tap/hark
          brew bottle --json --no-rebuild \
            --root-url "https://github.com/debanjanc01/hark/releases/download/$GITHUB_REF_NAME" \
            debanjanc01/tap/hark

      - name: Upload the bottle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # brew bottle names the file hark--X.Y.Z…; Homebrew downloads it as hark-X.Y.Z….
          json=$(ls hark--*.bottle.json)
          local=$(jq -r '.[].bottle.tags[].local_filename' "$json")
          remote=$(jq -r '.[].bottle.tags[].filename' "$json")
          mv "$local" "$remote"
          gh release upload "$GITHUB_REF_NAME" "$remote" "$json"
          {
            echo '### Bottle block for Formula/hark.rb'
            echo '```ruby'
            jq -r '.[].bottle as $b | "  bottle do\n    root_url \"\($b.root_url)\"\n" + ([$b.tags | to_entries[] | "    sha256 cellar: :\($b.cellar), \(.key): \"\(.value.sha256)\""] | join("\n")) + "\n  end"' "$json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
